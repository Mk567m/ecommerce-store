<title>Register</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-card {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      padding: 3rem;
      width: 100%;
      height:700px;
      max-width: 530px;
      transition: transform 0.3s ease;
    }
    .login-card:hover {
      transform: translateY(-5px);
    }
    .form-control:focus {
      border-color: #2575fc;
      box-shadow: 0 0 0 0.2rem rgba(37,117,252,0.25);
    }
    .btn-custom {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      border: none;
      color: #fff;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn-custom:hover {
      background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
    }
    .toggle-password {
      cursor: pointer;
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #888;
    }
    .form-row-custom {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
}

.form-row-custom label {
    width: 170px;
    font-weight: 600;
    
}

.form-row-custom input {
    width:280px;
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: 2px solid #ccc;
}
#submit{
    width:100%;
    border:5px solid rgb(117, 117, 211);
    height:60px;
    font-weight:800;
    font-size:x-large;
    
}


  </style>
</head>
<body>

 

  <div class="login-card">
    <br>
    <h1 align='center' class="text-center mb-3">Create Account</h1>
    <br>
    {% for message in messages %}
        <p align="center"  style="color:rgb(80, 101, 0);" >{{message}}!</p>
    {%endfor%}
    <br>
    <form action="" method="POST">
      {% csrf_token %}

      <div class="form-row-custom">
        <label for="first_name" class="form-label">First Name</label>
        {{form.first_name}}
      
      </div><div class="form-row-custom">
        <label for="last_name" class="form-label">Last Name</label>
        {{form.last_name}}
      </div>
      <div class="form-row-custom">
        <label for="first_name" class="form-label">Username</label>
        {{form.username}}
      </div>  
      <div class="form-row-custom">
        <label for="email" class="form-label">Email</label>
        {{form.email}}
      </div>
      
      <div class="form-row-custom">
        <label for="password" class="form-label">Password</label>
        {{form.password1}}
      </div>
      <div class="form-row-custom">
        <label for="password" class="form-label">Confirm Password</label>
        {{form.password2}}
        <hr>
        <br>
      </div>
        <div align="center">
        <span>already have an account? </span><span><h4><a id="login-link" href="{%url 'login'%}" >Login</a></h4></span>
        </div>
        
        <br>
       <button type="submit" id="submit" class="btn btn-custom btn-lg">Register</button>

      </div>
      
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);
    }
  </script>
</body>
</html>
