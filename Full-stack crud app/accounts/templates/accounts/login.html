

  <title>Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-card {
      height:600px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      padding: 5rem;
      width: 130%;
      max-width: 560px;
      transition: transform 0.3s ease;
    }
    .login-card:hover {
      transform: translateY(-5px);
    }
    .form-control:focus {
      border-color: #2575fc;
      box-shadow: 0 0 0 0.2rem rgba(37,117,252,0.25);
    }
    .btn-custom {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      border: none;
      color: #fff;
      font-weight: 600;
      transition: 0.2s;
    }
    .btn-custom:hover {
      background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
    }
    .toggle-password {
      cursor: pointer;
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateX(-60%);
      color: #888;
    }
    #forgot-password{
      margin-left:105px;
    }
    #login{
      margin-top:15px;
      width:340px;
     
      
    }
  </style>
</head>
<body>
 <!-- base.html -->


  {% block content %}
  <div class="login-card">
    <h3 class="text-center mb-4">Welcome Back 👋</h3>
    <br>
    {% for message in messages %}
        <p align="center"  style="background:linear-gradient(to right,rgb(0, 0, 0),rgb(84, 84, 84));color:rgb(86, 255, 252);" >{{message}}</p>
      {%endfor%}
    <br>
    <br>  
    <form action="" method="post">
      {% csrf_token %}
      <div class="mb-3 position-relative">
        <label for="username" class="form-label">Username</label>
        <input type="text" name="username" class="form-control" id="username" placeholder="Enter username">
      </div>
      <div class="mb-3 position-relative">
        <label for="password" class="form-label">Password</label>
        <input type="password" name="password" class="form-control" id="password" placeholder="Enter password">
        <span class="toggle-password" onclick="togglePassword()">👁️</span>
      </div>
      
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label" for="remember">Remember me</label>
        <a href="{%url 'forgotpassword'%}" id="forgot-password"  class="btn btn-sm btn-custom w-40">Forgot Password?</a>
        <br>
      
        <button id="login" class="btn btn-custom btn-lg" type="submit">Login</button>
        <hr>

          <p>Dont have an account, <span> <a align="right" class="btn btn-success" href="{%url 'register'%}">Create One for Free</a></span>
</p>
        
        
     
        </div>
        
        <br>
        
      </div>
      <br>
      
  
       </div> 
      <br>
          
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);
    }
  </script>
  {% endblock %}
</body>
</html>
